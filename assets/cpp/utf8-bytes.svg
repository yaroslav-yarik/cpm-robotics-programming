<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img" aria-labelledby="title desc">
<title id="title">Где начинается следующий символ</title>
<desc id="desc">В UTF-8 буква Я занимает D0 AF, а восклицательный знак начинается с индекса 2.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#395774"/></marker></defs>
<rect x="1" y="1" width="658" height="228" rx="12" fill="#f9fbfd" stroke="#c7d3df"/><text x="22" y="38" text-anchor="start" fill="#223450" font-family="Arial, sans-serif" font-size="24" font-weight="700">Где начинается следующий символ</text>
<text x="25" y="94" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Символ</text><rect x="160" y="65" width="285" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="302.5" y="94" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">Я</text><rect x="454" y="65" width="135" height="43" rx="5" fill="#ffe2b4" stroke="#d39845"/><text x="521.5" y="94" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">!</text><text x="25" y="153" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Байты</text><rect x="160" y="125" width="136" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="228" y="154" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">D0</text><rect x="307" y="125" width="136" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="375" y="154" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">AF</text><rect x="454" y="125" width="136" height="43" rx="5" fill="#ffe2b4" stroke="#d39845"/><text x="522" y="154" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">21</text><text x="25" y="204" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Индекс</text><text x="228" y="205" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="20" font-weight="400">0</text><text x="375" y="205" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="20" font-weight="400">1</text><text x="522" y="205" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="20" font-weight="400">2</text>
</svg>
