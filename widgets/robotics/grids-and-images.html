<section class="experiment">
<h3>Запиши байт в кадровый буфер</h3>
<p>Выбери яркость и нажми на клетку экрана. Затем выбери смещение в буфере и запиши по нему другое значение для той же клетки. Обе записи меняют один массив из 12 байтов.</p>
<label>Яркость <select data-light><option value="0">0 — чёрный</option><option value="85">85</option><option value="170">170</option><option selected value="255">255 — белый</option></select></label>
<p>Экран · 3 строки × 4 столбца</p>
<div data-screen style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.25rem;max-width:20rem"><button type="button" data-pixel="0" aria-label="Строка 0, столбец 0">0</button><button type="button" data-pixel="1" aria-label="Строка 0, столбец 1">0</button><button type="button" data-pixel="2" aria-label="Строка 0, столбец 2">0</button><button type="button" data-pixel="3" aria-label="Строка 0, столбец 3">0</button><button type="button" data-pixel="4" aria-label="Строка 1, столбец 0">0</button><button type="button" data-pixel="5" aria-label="Строка 1, столбец 1">0</button><button type="button" data-pixel="6" aria-label="Строка 1, столбец 2">0</button><button type="button" data-pixel="7" aria-label="Строка 1, столбец 3">0</button><button type="button" data-pixel="8" aria-label="Строка 2, столбец 0">0</button><button type="button" data-pixel="9" aria-label="Строка 2, столбец 1">0</button><button type="button" data-pixel="10" aria-label="Строка 2, столбец 2">0</button><button type="button" data-pixel="11" aria-label="Строка 2, столбец 3">0</button></div>
<p><label>Смещение <select data-offset><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option></select></label> <button data-write type="button">Записать байт</button></p>
<p>Байты буфера в hex, по возрастанию адресов</p><p><samp data-buffer></samp></p><p role="status"></p><button type="button" data-reset>Очистить экран</button>
<script>
(() => {
  const root = document.currentScript.closest(".experiment");
  const find = selector => root.querySelector(selector);
  const data = new Uint8Array(12);
  const offset = find('[data-offset]');
  const cells = root.querySelectorAll('[data-pixel]');
  function show(message) {
    cells.forEach((button, index) => {
      const value = data[index];
      button.textContent = value;
      button.style.backgroundColor = 'rgb(' + [value, value, value].join(',') + ')';
      button.style.color = value >= 170 ? '#000' : '#fff';
      button.setAttribute('aria-label', 'Строка ' + Math.floor(index / 4) + ', столбец ' + (index % 4) + ', яркость ' + value);
    });
    find('[data-buffer]').textContent = Array.from(data, value => value.toString(16).toUpperCase().padStart(2, '0')).join(' ');
    find('[role=status]').textContent = message;
  }
  function write(index) {
    const value = Number(find('[data-light]').value);
    const row = Math.floor(index / 4);
    const col = index % 4;
    data[index] = value;
    offset.value = String(index);
    show('Пиксель (' + row + ', ' + col + '): смещение ' + row + ' × 4 + ' + col + ' = ' + index + '. Записана яркость ' + value + '.');
  }
  cells.forEach((button, index) => button.addEventListener('click', () => write(index)));
  find('[data-write]').addEventListener('click', () => write(Number(offset.value)));
  find('[data-reset]').addEventListener('click', () => {
    data.fill(0);
    show('Во всех двенадцати ячейках записаны нули.');
  });
  show('Буфер заполнен нулями. Найди пиксель со смещением 6.');
})();
</script>
</section>
