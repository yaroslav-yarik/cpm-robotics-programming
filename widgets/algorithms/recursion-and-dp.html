<section class="experiment">
<h3>Пройди дерево решений</h3>
<p>Попробуй получить все четыре подмножества чисел 2 и −1. Каждый выбор ведёт в следующий вызов. Вернись на один уровень и измени только последний выбор.</p>
<div class="controls"><button type="button" name="skip">Пропустить</button><button type="button" name="take">Взять</button><button type="button" name="back">Вернуться на уровень</button><button type="button" name="reset">Очистить дерево</button></div>
<p data-path></p><p data-state role="status"></p><ul data-leaves></ul>
<noscript>Для работы этого примера нужен JavaScript.</noscript>
<script>
(() => {
  const section = document.currentScript.closest('.experiment');
  const pick = selector => section.querySelector(selector);
  const a = [2, -1], path = [], leaves = new Map();
  function render() {
    const items = a.filter((_, i) => path[i] === true);
    const sum = items.reduce((total, n) => total + n, 0);
    const done = path.length === a.length;
    if (done) leaves.set(path.map(Number).join(''), '{' + items.join(', ') + '} · сумма ' + sum);
    pick('[name="take"]').disabled = pick('[name="skip"]').disabled = done;
    pick('[name="back"]').disabled = !path.length;
    pick('[data-path]').textContent = 'Путь от корня · ' + (path.map((take,i) => (take ? 'взять ' : 'пропустить ') + a[i]).join(' → ') || 'выборов пока нет');
    const position = done ? 'Достигнут лист.' : 'Следующий элемент a[' + path.length + '] = ' + a[path.length] + '.';
    pick('[data-state]').textContent = position + ' Текущая сумма ' + sum + '. Найдено подмножеств ' + leaves.size + ' из 4.';
    const list = pick('[data-leaves]'); list.replaceChildren();
    for (const value of leaves.values()) { const li = document.createElement('li'); li.textContent = value; list.append(li); }
  }
  pick('[name="take"]').onclick = () => { path.push(true); render(); };
  pick('[name="skip"]').onclick = () => { path.push(false); render(); };
  pick('[name="back"]').onclick = () => { path.pop(); render(); };
  pick('[name="reset"]').onclick = () => { path.length = 0; leaves.clear(); render(); };
  render();
})();
</script>
</section>
