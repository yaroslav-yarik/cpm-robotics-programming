<section class="experiment">
<h3>Сложи два входных бита</h3>
<p>Подай две единицы. Затем выключи любой вход и проследи отдельно за битом суммы и переносом.</p>
<label><input type="checkbox" data-a checked> На входе A единица</label>
<label><input type="checkbox" data-b checked> На входе B единица</label>
<p><samp data-gates></samp></p>
<p role="status"></p>
<script>
(() => {
  const root = document.currentScript.closest(".experiment");
  const find = selector => root.querySelector(selector);
  function update() {
    const a = Number(find('[data-a]').checked);
    const b = Number(find('[data-b]').checked);
    const sumBit = a ^ b;
    const carryBit = a & b;
    find('[data-gates]').textContent = 'XOR(' + a + ', ' + b + ') = ' + sumBit + '   ·   AND(' + a + ', ' + b + ') = ' + carryBit;
    find('[role=status]').textContent = 'В текущий разряд записываем ' + sumBit + ', в следующий переносим ' + carryBit + '. Вместе получается ' + carryBit + sumBit + '₂ = ' + (a + b) + '.';
  }
  root.addEventListener('change', update);
  update();
})();
</script>
</section>
