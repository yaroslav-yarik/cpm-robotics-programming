<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 740 300"><title id="title">Строки кэша</title><desc id="desc">В модели с двумя строками по 16 байтов первое и третье чтения вызывают загрузку, второе и четвёртое попадают в кэш.</desc><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#48647b"/></marker></defs><rect width="740" height="300" rx="12" fill="#fafbfd"/><g font-family="Arial, sans-serif"><text x="24" y="37" text-anchor="start" fill="#172f45" font-size="25" font-weight="700">Какие чтения используют одну строку кэша?</text><text x="76" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[0]</text><rect x="36" y="96" width="77" height="55" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="75" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+0</text><text x="159" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[1]</text><rect x="119" y="96" width="77" height="55" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="158" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+4</text><text x="242" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[2]</text><rect x="202" y="96" width="77" height="55" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="241" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+8</text><text x="325" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[3]</text><rect x="285" y="96" width="77" height="55" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="324" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+12</text><text x="408" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[4]</text><rect x="368" y="96" width="77" height="55" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="407" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+16</text><text x="491" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[5]</text><rect x="451" y="96" width="77" height="55" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="490" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+20</text><text x="574" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[6]</text><rect x="534" y="96" width="77" height="55" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="573" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+24</text><text x="657" y="81" text-anchor="middle" fill="#172f45" font-size="20" font-weight="400">a[7]</text><rect x="617" y="96" width="77" height="55" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="656" y="131" text-anchor="middle" fill="#172f45" font-size="21" font-weight="400">+28</text><text x="36" y="186" text-anchor="start" fill="#172f45" font-size="20" font-weight="700">Строка A · байты 0–15</text><text x="369" y="186" text-anchor="start" fill="#172f45" font-size="20" font-weight="700">Строка B · байты 16–31</text><text x="36" y="236" text-anchor="start" fill="#172f45" font-size="23" font-weight="700">Читаем a[0], a[1], a[4], a[2]</text><text x="36" y="268" text-anchor="start" fill="#172f45" font-size="19" font-weight="400">A загружается → A уже есть → B загружается → A уже есть</text></g></svg>
