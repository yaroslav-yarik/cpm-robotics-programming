<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 740 309"><title id="title">Три инструкции</title><desc id="desc">Загрузка переносит число в регистр, АЛУ прибавляет пять, запись возвращает новое значение по исходному адресу.</desc><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#48647b"/></marker></defs><rect width="740" height="309" rx="12" fill="#fafbfd"/><g font-family="Arial, sans-serif"><text x="24" y="37" text-anchor="start" fill="#172f45" font-size="25" font-weight="700">Один элемент массива увеличивается на 5</text><rect x="28" y="61" width="183" height="57" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="119" y="97" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">Память</text><path d="M213 89 L320 89" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="323" y="61" width="175" height="57" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="410" y="97" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">регистр t0</text><text x="521" y="97" text-anchor="start" fill="#172f45" font-size="21" font-weight="400">читаем 7</text><rect x="28" y="142" width="183" height="57" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="119" y="178" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">АЛУ: 7 + 5</text><path d="M213 170 L320 170" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="323" y="142" width="175" height="57" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="410" y="178" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">регистр t0</text><text x="521" y="178" text-anchor="start" fill="#172f45" font-size="21" font-weight="400">получаем 12</text><rect x="28" y="223" width="183" height="57" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="119" y="259" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">Регистр t0</text><path d="M213 251 L320 251" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="323" y="223" width="175" height="57" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="410" y="259" text-anchor="middle" fill="#172f45" font-size="21" font-weight="700">память</text><text x="521" y="259" text-anchor="start" fill="#172f45" font-size="21" font-weight="400">записываем 12</text></g></svg>
