<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 740 265"><title id="title">Полусумматор</title><desc id="desc">Одна пара входов 1 и 1 подана на XOR и AND. Получаются сумма 0 и перенос 1.</desc><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#48647b"/></marker></defs><rect width="740" height="265" rx="12" fill="#fafbfd"/><g font-family="Arial, sans-serif"><text x="24" y="37" text-anchor="start" fill="#172f45" font-size="25" font-weight="700">Сложение двух битов без входного переноса</text><rect x="28" y="65" width="144" height="78" rx="8" fill="#edf3fb" stroke="#9eafbf" stroke-width="2"/><text x="100.0" y="97" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">A = 1, B = 1</text><text x="100.0" y="124" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">оба входа</text><path d="M174 104 L235 104" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="237" y="65" width="215" height="78" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="344.5" y="97" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">XOR</text><text x="344.5" y="124" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">разные входы → 1</text><path d="M454 104 L510 104" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="65" width="200" height="78" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="612.0" y="97" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Сумма = 0</text><text x="612.0" y="124" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">в этот разряд</text><rect x="28" y="168" width="144" height="78" rx="8" fill="#edf3fb" stroke="#9eafbf" stroke-width="2"/><text x="100.0" y="200" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">A = 1, B = 1</text><text x="100.0" y="227" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">оба входа</text><path d="M174 207 L235 207" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="237" y="168" width="215" height="78" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="344.5" y="200" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">AND</text><text x="344.5" y="227" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">две единицы → 1</text><path d="M454 207 L510 207" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="168" width="200" height="78" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="612.0" y="200" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Перенос = 1</text><text x="612.0" y="227" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">в соседний разряд</text></g></svg>
