<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 740 269"><title id="title">Перевод адреса</title><desc id="desc">Страница размером 4096 байтов. В примере виртуальный адрес 0x3008 соответствует физическому 0x9008.</desc><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#48647b"/></marker></defs><rect width="740" height="269" rx="12" fill="#fafbfd"/><g font-family="Arial, sans-serif"><text x="24" y="37" text-anchor="start" fill="#172f45" font-size="25" font-weight="700">Виртуальная страница и физическая страница</text><rect x="25" y="70" width="201" height="78" rx="8" fill="#edf3fb" stroke="#9eafbf" stroke-width="2"/><text x="125.5" y="102" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Страница 3</text><text x="125.5" y="129" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">виртуальная</text><path d="M227 109 L291 109" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="293" y="70" width="177" height="78" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="381.5" y="102" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">3 → 9</text><text x="381.5" y="129" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">таблица страниц</text><path d="M472 109 L512 109" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="514" y="70" width="200" height="78" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="614.0" y="102" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Страница 9</text><text x="614.0" y="129" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">физическая</text><text x="29" y="197" text-anchor="start" fill="#172f45" font-size="23" font-weight="700">Смещение внутри страницы сохраняется</text><text x="29" y="235" text-anchor="start" fill="#172f45" font-size="23" font-weight="400">0x3008 = 0x3000 + 8</text><path d="M306 228 L402 228" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="235" text-anchor="start" fill="#172f45" font-size="23" font-weight="400">0x9008 = 0x9000 + 8</text></g></svg>
