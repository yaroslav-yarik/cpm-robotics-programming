<svg xmlns="http://www.w3.org/2000/svg" width="620" height="315" viewBox="0 0 620 315" role="img" aria-labelledby="title desc">
<title id="title">Интервал работы индикатора</title><desc id="desc">Высокий уровень с 10 включительно до 15 исключительно. Первое чтение на границе возвращает низкий уровень.</desc>
<rect width="620" height="315" rx="8" fill="#f6f9fb"/>
<g font-family="Arial, sans-serif">
<text x="24" y="38" font-size="26" fill="#173449" text-anchor="start">Таймер считает даже между чтениями</text>
<text x="585" y="157" font-size="16" fill="#173449" text-anchor="start">мс</text>
<path d="M65 115 L65 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="65" y="157" font-size="18" fill="#173449" text-anchor="middle">10</text>
<path d="M145 115 L145 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="145" y="157" font-size="18" fill="#173449" text-anchor="middle">11</text>
<path d="M225 115 L225 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="225" y="157" font-size="18" fill="#173449" text-anchor="middle">12</text>
<path d="M305 115 L305 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="305" y="157" font-size="18" fill="#173449" text-anchor="middle">13</text>
<path d="M385 115 L385 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="385" y="157" font-size="18" fill="#173449" text-anchor="middle">14</text>
<path d="M465 115 L465 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="465" y="157" font-size="18" fill="#173449" text-anchor="middle">15</text>
<path d="M545 115 L545 133" fill="none" stroke="#a2b5c2" stroke-width="1"/>
<text x="545" y="157" font-size="18" fill="#173449" text-anchor="middle">16</text>
<rect x="65" y="97" width="400" height="23" rx="4" fill="#09635b" stroke="none"/>
<rect x="465" y="97" width="80" height="23" rx="4" fill="#cdd9e1" stroke="none"/>
<text x="80" y="86" font-size="19" fill="#09635b" text-anchor="start">горит</text>
<text x="477" y="86" font-size="19" fill="#173449" text-anchor="start">погас</text>
<path d="M465 93 L465 137" fill="none" stroke="#9a4a14" stroke-width="3"/>
<text x="24" y="207" font-size="20" fill="#09635b" text-anchor="start">10 мс</text>
<text x="125" y="207" font-size="19" fill="#173449" text-anchor="start">Записали срок выключения: 10 + 5 = 15.</text>
<text x="24" y="247" font-size="20" fill="#09635b" text-anchor="start">14 мс</text>
<text x="125" y="247" font-size="19" fill="#173449" text-anchor="start">Сравнение 14 &lt; 15 даёт «горит».</text>
<text x="24" y="287" font-size="20" fill="#9a4a14" text-anchor="start">15 мс</text>
<text x="125" y="287" font-size="19" fill="#173449" text-anchor="start">Срок достигнут. Индикатор гаснет.</text>
</g></svg>
