<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 239" width="660" height="239" role="img" aria-labelledby="title desc">
<title id="title">Что меняет запись *p = 99</title>
<desc id="desc">На little-endian машине с четырёхбайтовым int байты по адресам 0x1004–0x1007 меняются с 14 00 00 00 на 63 00 00 00.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#395774"/></marker></defs>
<rect x="1" y="1" width="658" height="237" rx="12" fill="#f9fbfd" stroke="#c7d3df"/><text x="22" y="38" text-anchor="start" fill="#223450" font-family="Arial, sans-serif" font-size="24" font-weight="700">Что меняет запись *p = 99</text>
<text x="24" y="70" text-anchor="start" fill="#415975" font-family="Arial, sans-serif" font-size="16" font-weight="400">Четыре байта элемента a[1], младший байт первым</text><text x="225" y="102" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="17" font-weight="400">0x1004</text><text x="329" y="102" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="17" font-weight="400">0x1005</text><text x="433" y="102" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="17" font-weight="400">0x1006</text><text x="537" y="102" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="17" font-weight="400">0x1007</text><text x="24" y="142" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Было 20</text><text x="24" y="201" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Стало 99</text><rect x="180" y="115" width="90" height="43" rx="5" fill="#ffe2b4" stroke="#d39845"/><text x="225" y="144" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">14</text><rect x="180" y="174" width="90" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="225" y="203" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">63</text><rect x="284" y="115" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="329" y="144" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text><rect x="284" y="174" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="329" y="203" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text><rect x="388" y="115" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="433" y="144" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text><rect x="388" y="174" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="433" y="203" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text><rect x="492" y="115" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="537" y="144" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text><rect x="492" y="174" width="90" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="537" y="203" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">00</text>
