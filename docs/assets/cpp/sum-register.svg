<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 195" width="660" height="195" role="img" aria-labelledby="title desc">
<title id="title">Как 7 превращается в 12</title>
<desc id="desc">Из регистра берут 7, складывают с 5 и записывают 12 обратно в регистр.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#395774"/></marker></defs>
<rect x="1" y="1" width="658" height="193" rx="12" fill="#f9fbfd" stroke="#c7d3df"/><text x="22" y="38" text-anchor="start" fill="#223450" font-family="Arial, sans-serif" font-size="24" font-weight="700">Как 7 превращается в 12</text>
<text x="29" y="77" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Регистр до</text><text x="237" y="77" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Сложение</text><text x="484" y="77" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Регистр после</text><rect x="29" y="91" width="115" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="86.5" y="120" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">7</text><path d="M150 113 L221 113" fill="none" stroke="#395774" stroke-width="2.5" marker-end="url(#arr)"/><rect x="232" y="91" width="153" height="43" rx="5" fill="#ffe2b4" stroke="#d39845"/><text x="308.5" y="120" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">7 + 5</text><path d="M392 113 L470 113" fill="none" stroke="#395774" stroke-width="2.5" marker-end="url(#arr)"/><rect x="483" y="91" width="145" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="555.5" y="120" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">12</text><text x="29" y="168" text-anchor="start" fill="#415975" font-family="Arial, sans-serif" font-size="16" font-weight="400">Три момента выполнения. До и после показан один и тот же регистр.</text>
</svg>
