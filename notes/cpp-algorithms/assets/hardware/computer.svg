<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 740 300"><title id="title">От клавиши до экрана</title><desc id="desc">Событие клавиатуры обрабатывает программа. Результат попадает в память изображения, затем на экран.</desc><defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#48647b"/></marker></defs><rect width="740" height="300" rx="12" fill="#fafbfd"/><g font-family="Arial, sans-serif"><text x="24" y="37" text-anchor="start" fill="#172f45" font-size="25" font-weight="700">Что происходит после нажатия клавиши</text><rect x="24" y="67" width="182" height="78" rx="8" fill="#edf3fb" stroke="#9eafbf" stroke-width="2"/><text x="115.0" y="99" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Клавиатура</text><text x="115.0" y="126" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">код клавиши</text><path d="M207 106 L262 106" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="264" y="67" width="208" height="78" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="368.0" y="99" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Контроллер</text><text x="368.0" y="126" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">событие ввода</text><path d="M473 106 L526 106" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="528" y="67" width="186" height="78" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="621.0" y="99" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Процессор</text><text x="621.0" y="126" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">работа программы</text><path d="M620 145 L620 194" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="507" y="198" width="207" height="78" rx="8" fill="#edf3fb" stroke="#9eafbf" stroke-width="2"/><text x="610.5" y="230" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Память</text><text x="610.5" y="257" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">данные изображения</text><path d="M505 237 L418 237" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="184" y="198" width="230" height="78" rx="8" fill="#fff0c9" stroke="#9eafbf" stroke-width="2"/><text x="299.0" y="230" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Контроллер экрана</text><text x="299.0" y="257" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">считывает пиксели</text><path d="M182 237 L149 237" fill="none" stroke="#48647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="198" width="126" height="78" rx="8" fill="#d9f1e6" stroke="#9eafbf" stroke-width="2"/><text x="83.0" y="230" text-anchor="middle" fill="#172f45" font-size="22" font-weight="700">Экран</text><text x="83.0" y="257" text-anchor="middle" fill="#172f45" font-size="17" font-weight="400">свет точек</text></g></svg>
