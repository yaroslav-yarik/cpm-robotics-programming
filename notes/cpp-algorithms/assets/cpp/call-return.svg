<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 239" width="660" height="239" role="img" aria-labelledby="title desc">
<title id="title">Куда вернётся square</title>
<desc id="desc">Вызов передаёт 4 и сохраняет адрес продолжения, функция умножает 4 на 4 и возвращает 16.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#395774"/></marker></defs>
<rect x="1" y="1" width="658" height="237" rx="12" fill="#f9fbfd" stroke="#c7d3df"/><text x="22" y="38" text-anchor="start" fill="#223450" font-family="Arial, sans-serif" font-size="24" font-weight="700">Куда вернётся square</text>
<text x="24" y="83" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Вызывающий код</text><text x="417" y="83" text-anchor="start" fill="#254a70" font-family="Arial, sans-serif" font-size="18" font-weight="650">Код square</text><rect x="24" y="98" width="151" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="99.5" y="127" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">side = 4</text><rect x="415" y="98" width="210" height="43" rx="5" fill="#e6edf5" stroke="#bfcbdb"/><text x="520" y="127" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">number = 4</text><path d="M184 120 L403 120" fill="none" stroke="#395774" stroke-width="2.5" marker-end="url(#arr)"/><text x="215" y="108" text-anchor="start" fill="#415975" font-family="Arial, sans-serif" font-size="16" font-weight="400">аргумент</text><rect x="24" y="169" width="151" height="43" rx="5" fill="#bfe9d8" stroke="#539b83"/><text x="99.5" y="198" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">area = 16</text><rect x="415" y="169" width="210" height="43" rx="5" fill="#ffe2b4" stroke="#d39845"/><text x="520" y="198" text-anchor="middle" fill="#223450" font-family="Consolas, monospace" font-size="21" font-weight="600">4 × 4 = 16</text><path d="M403 190 L186 190" fill="none" stroke="#395774" stroke-width="2.5" marker-end="url(#arr)"/><text x="217" y="180" text-anchor="start" fill="#415975" font-family="Arial, sans-serif" font-size="16" font-weight="400">результат</text><path d="M518 143 L518 162" fill="none" stroke="#395774" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
