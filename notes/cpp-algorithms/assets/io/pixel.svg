<svg xmlns="http://www.w3.org/2000/svg" width="620" height="321" viewBox="0 0 620 321" role="img" aria-labelledby="title desc">
<title id="title">Адрес пикселя в буфере</title><desc id="desc">Три строки по четыре байта. Ячейка в строке 1, столбце 2 находится по смещению 6 от начала.</desc>
<rect width="620" height="321" rx="8" fill="#f6f9fb"/>
<g font-family="Arial, sans-serif">
<text x="24" y="38" font-size="26" fill="#173449" text-anchor="start">Как найти клетку в плоском буфере</text>
<text x="24" y="80" font-size="20" fill="#173449" text-anchor="start">4 столбца, 1 байт на клетку</text>
<text x="23" y="131" font-size="16" fill="#173449" text-anchor="start">стр. 0</text>
<rect x="85" y="103" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="111" y="131" font-size="19" fill="#173449" text-anchor="middle">0</text>
<rect x="142" y="103" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="168" y="131" font-size="19" fill="#173449" text-anchor="middle">1</text>
<rect x="199" y="103" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="225" y="131" font-size="19" fill="#173449" text-anchor="middle">2</text>
<rect x="256" y="103" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="282" y="131" font-size="19" fill="#173449" text-anchor="middle">3</text>
<text x="23" y="178" font-size="16" fill="#173449" text-anchor="start">стр. 1</text>
<rect x="85" y="150" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="111" y="178" font-size="19" fill="#173449" text-anchor="middle">4</text>
<rect x="142" y="150" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="168" y="178" font-size="19" fill="#173449" text-anchor="middle">5</text>
<rect x="199" y="150" width="52" height="42" rx="4" fill="#09635b" stroke="none"/>
<text x="225" y="178" font-size="19" fill="white" text-anchor="middle">6</text>
<rect x="256" y="150" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="282" y="178" font-size="19" fill="#173449" text-anchor="middle">7</text>
<text x="23" y="225" font-size="16" fill="#173449" text-anchor="start">стр. 2</text>
<rect x="85" y="197" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="111" y="225" font-size="19" fill="#173449" text-anchor="middle">8</text>
<rect x="142" y="197" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="168" y="225" font-size="19" fill="#173449" text-anchor="middle">9</text>
<rect x="199" y="197" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="225" y="225" font-size="19" fill="#173449" text-anchor="middle">10</text>
<rect x="256" y="197" width="52" height="42" rx="4" fill="#dee7ed" stroke="none"/>
<text x="282" y="225" font-size="19" fill="#173449" text-anchor="middle">11</text>
<text x="340" y="126" font-size="19" fill="#173449" text-anchor="start">В клетках указаны</text>
<text x="340" y="153" font-size="19" fill="#173449" text-anchor="start">смещения в байтах.</text>
<text x="340" y="196" font-size="19" fill="#09635b" text-anchor="start">Строка 1, столбец 2</text>
<text x="340" y="225" font-size="22" fill="#09635b" text-anchor="start">1 × 4 + 2 = 6</text>
<text x="24" y="282" font-size="18" fill="#173449" text-anchor="start">Буфер</text>
<rect x="102" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="121" y="281" font-size="16" fill="#173449" text-anchor="middle">0</text>
<rect x="142" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="161" y="281" font-size="16" fill="#173449" text-anchor="middle">1</text>
<rect x="182" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="201" y="281" font-size="16" fill="#173449" text-anchor="middle">2</text>
<rect x="222" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="241" y="281" font-size="16" fill="#173449" text-anchor="middle">3</text>
<rect x="262" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="281" y="281" font-size="16" fill="#173449" text-anchor="middle">4</text>
<rect x="302" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="321" y="281" font-size="16" fill="#173449" text-anchor="middle">5</text>
<rect x="342" y="255" width="38" height="38" rx="4" fill="#09635b" stroke="none"/>
<text x="361" y="281" font-size="16" fill="white" text-anchor="middle">6</text>
<rect x="382" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="401" y="281" font-size="16" fill="#173449" text-anchor="middle">7</text>
<rect x="422" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="441" y="281" font-size="16" fill="#173449" text-anchor="middle">8</text>
<rect x="462" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="481" y="281" font-size="16" fill="#173449" text-anchor="middle">9</text>
<rect x="502" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="521" y="281" font-size="16" fill="#173449" text-anchor="middle">10</text>
<rect x="542" y="255" width="38" height="38" rx="4" fill="#dee7ed" stroke="none"/>
<text x="561" y="281" font-size="16" fill="#173449" text-anchor="middle">11</text>
</g></svg>
