<svg xmlns="http://www.w3.org/2000/svg" width="624" height="315" viewBox="0 0 624 315" role="img" aria-labelledby="title desc">
<title id="title">Как фильтр подтверждает нажатие</title><desc id="desc">Сырые показания 1, 0, 1, 1. При двух одинаковых отсчётах подряд выход принимает значения 0, 0, 0, 1.</desc>
<rect width="624" height="315" rx="8" fill="#f6f9fb"/>
<g font-family="Arial, sans-serif">
<text x="24" y="38" font-size="26" fill="#173449" text-anchor="start">Кнопка: четыре чтения входа</text>
<text x="24" y="82" font-size="18" fill="#173449" text-anchor="start">Номер чтения</text>
<text x="24" y="133" font-size="20" fill="#173449" text-anchor="start">На входе</text>
<text x="24" y="203" font-size="20" fill="#173449" text-anchor="start">После фильтра</text>
<text x="239" y="82" font-size="18" fill="#173449" text-anchor="middle">1</text>
<rect x="200" y="100" width="78" height="52" rx="4" fill="#09635b" stroke="none"/>
<text x="239" y="134" font-size="24" fill="white" text-anchor="middle">1</text>
<rect x="200" y="170" width="78" height="52" rx="4" fill="#e2e9ed" stroke="none"/>
<text x="239" y="204" font-size="24" fill="#173449" text-anchor="middle">0</text>
<text x="335" y="82" font-size="18" fill="#173449" text-anchor="middle">2</text>
<rect x="296" y="100" width="78" height="52" rx="4" fill="#e2e9ed" stroke="none"/>
<text x="335" y="134" font-size="24" fill="#173449" text-anchor="middle">0</text>
<rect x="296" y="170" width="78" height="52" rx="4" fill="#e2e9ed" stroke="none"/>
<text x="335" y="204" font-size="24" fill="#173449" text-anchor="middle">0</text>
<text x="431" y="82" font-size="18" fill="#173449" text-anchor="middle">3</text>
<rect x="392" y="100" width="78" height="52" rx="4" fill="#09635b" stroke="none"/>
<text x="431" y="134" font-size="24" fill="white" text-anchor="middle">1</text>
<rect x="392" y="170" width="78" height="52" rx="4" fill="#e2e9ed" stroke="none"/>
<text x="431" y="204" font-size="24" fill="#173449" text-anchor="middle">0</text>
<text x="527" y="82" font-size="18" fill="#173449" text-anchor="middle">4</text>
<rect x="488" y="100" width="78" height="52" rx="4" fill="#09635b" stroke="none"/>
<text x="527" y="134" font-size="24" fill="white" text-anchor="middle">1</text>
<rect x="488" y="170" width="78" height="52" rx="4" fill="#09635b" stroke="none"/>
<text x="527" y="204" font-size="24" fill="white" text-anchor="middle">1</text>
<text x="24" y="264" font-size="20" fill="#173449" text-anchor="start">На чтениях 3 и 4 подряд пришла единица.</text>
<text x="24" y="292" font-size="20" fill="#09635b" text-anchor="start">Четвёртое чтение подтверждает нажатие.</text>
</g></svg>
